# Bouwt de Windows-installer en publiceert hem als GitHub Release.
# Starten: maak een tag, bijv.  git tag v1.0.1 && git push --tags
# (of via GitHub: Actions > Release > Run workflow).
# De kassa's halen de nieuwe versie daarna zelf op.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Versie uit de tag overnemen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - run: npm ci
      - name: Bouwen
        run: npx electron-builder --win --x64 --publish never
      - name: Publiceren als één GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          if gh release view "$V" >/dev/null 2>&1; then
            echo "Release $V bestaat al; verhoog de versie in app/package.json." && exit 1
          fi
          gh release create "$V" --title "Super Photo Kassa $V" --notes "Automatische update" --target "$GITHUB_SHA" \
            dist/*.exe dist/*.exe.blockmap dist/latest.yml
